<div class="page">
  <form nz-form nzLayout="inline" class="query-form">
    <nz-form-item>
      <nz-form-label>角色名称</nz-form-label>
      <nz-form-control>
        <input nz-input [(ngModel)]="query.roleName" name="roleName" placeholder="请输入角色名称" (keyup.enter)="onQuery()" />
      </nz-form-control>
    </nz-form-item>
    <nz-form-item>
      <nz-form-label>权限字符</nz-form-label>
      <nz-form-control>
        <input nz-input [(ngModel)]="query.roleKey" name="roleKey" placeholder="请输入权限字符" (keyup.enter)="onQuery()" />
      </nz-form-control>
    </nz-form-item>
    <nz-form-item>
      <nz-form-label>状态</nz-form-label>
      <nz-form-control>
        <nz-select [(ngModel)]="query.status" name="status" nzAllowClear nzPlaceHolder="角色状态" style="width: 160px">
          @for (d of statusOptions; track d.value) {
            <nz-option [nzValue]="d.value" [nzLabel]="d.label"></nz-option>
          }
        </nz-select>
      </nz-form-control>
    </nz-form-item>
    <nz-form-item>
      <button nz-button nzType="primary" (click)="onQuery()"><span nz-icon nzType="search"></span>搜索</button>
      <button nz-button class="ml8" (click)="onReset()"><span nz-icon nzType="reload"></span>重置</button>
    </nz-form-item>
  </form>

  <div class="toolbar">
    <button *hasPermi="['system:role:add']" nz-button nzType="primary" (click)="openAdd()"><span nz-icon nzType="plus"></span>新增</button>
    <button *hasPermi="['system:role:edit']" nz-button [disabled]="checkedIds.size !== 1" (click)="openEdit()"><span nz-icon nzType="edit"></span>修改</button>
    <button *hasPermi="['system:role:remove']" nz-button nzDanger [disabled]="!checkedIds.size" (click)="remove()"><span nz-icon nzType="delete"></span>删除</button>
    <button *hasPermi="['system:role:export']" nz-button (click)="export()"><span nz-icon nzType="download"></span>导出</button>
  </div>

  <app-builder-table
    #bt
    [columns]="columns"
    [data]="list()"
    [loading]="loading()"
    [total]="total()"
    [pageIndex]="query.pageNum"
    [pageSize]="query.pageSize"
    rowKey="roleId"
    actionWidth="260px"
    (pageIndexChange)="onPageIndexChange($event)"
    (pageSizeChange)="onPageSizeChange($event)"
    (selectionChange)="onSelection($event)"
  >
    <ng-template #actions let-row>
      @if (row.roleId !== 1) {
        <a *hasPermi="['system:role:edit']" (click)="openEdit(row)">修改</a>
        <span class="sep">|</span>
        <a *hasPermi="['system:role:remove']" (click)="remove(row)">删除</a>
        <span class="sep">|</span>
        <a *hasPermi="['system:role:edit']" (click)="openDataScope(row)">数据权限</a>
        <span class="sep">|</span>
        <a *hasPermi="['system:role:edit']" (click)="goAuthUser(row)">分配用户</a>
      }
    </ng-template>
  </app-builder-table>

</div>

<nz-modal
  [(nzVisible)]="modalVisible"
  [nzTitle]="modalTitle"
  [nzWidth]="680"
  [nzFooter]="modalFooter"
  (nzOnCancel)="modalVisible = false"
>
  <ng-container *nzModalContent>
    @if (modalVisible) {
      <app-builder-form #bf layout="vertical" [showSubmit]="false" [formConfig]="formConfig"></app-builder-form>
    }
  </ng-container>
</nz-modal>
<ng-template #modalFooter>
  <button nz-button (click)="modalVisible = false">取 消</button>
  <button nz-button nzType="primary" [nzLoading]="submitting" (click)="save()">确 定</button>
</ng-template>

<nz-modal
  [(nzVisible)]="dataScopeVisible"
  nzTitle="分配数据权限"
  [nzWidth]="500"
  [nzFooter]="dataScopeFooter"
  (nzOnCancel)="dataScopeVisible = false"
>
  <ng-container *nzModalContent>
    @if (dataScopeVisible) {
      <app-builder-form #dsf layout="vertical" [showSubmit]="false" [formConfig]="dataScopeFormConfig"></app-builder-form>
    }
  </ng-container>
</nz-modal>
<ng-template #dataScopeFooter>
  <button nz-button (click)="dataScopeVisible = false">取 消</button>
  <button nz-button nzType="primary" [nzLoading]="dataScopeSubmitting" (click)="submitDataScope()">确 定</button>
</ng-template>
