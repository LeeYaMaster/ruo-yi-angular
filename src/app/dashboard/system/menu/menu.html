<div class="page">
  <form nz-form nzLayout="inline" class="query-form">
    <nz-form-item>
      <nz-form-label>菜单名称</nz-form-label>
      <nz-form-control>
        <input nz-input [(ngModel)]="query.menuName" name="menuName" placeholder="请输入菜单名称" (keyup.enter)="onQuery()" />
      </nz-form-control>
    </nz-form-item>
    <nz-form-item>
      <nz-form-label>状态</nz-form-label>
      <nz-form-control>
        <nz-select [(ngModel)]="query.status" name="status" nzAllowClear nzPlaceHolder="菜单状态" style="width: 160px">
          @for (d of statusOptions; track d.value) {
            <nz-option [nzValue]="d.value" [nzLabel]="d.label"></nz-option>
          }
        </nz-select>
      </nz-form-control>
    </nz-form-item>
    <nz-form-item>
      <button nz-button nzType="primary" (click)="onQuery()"><span nz-icon nzType="search"></span>搜索</button>
      <button nz-button class="ml8" (click)="onReset()"><span nz-icon nzType="reload"></span>重置</button>
    </nz-form-item>
  </form>

  <div class="toolbar">
    <button *hasPermi="['system:menu:add']" nz-button nzType="primary" (click)="openAdd()"><span nz-icon nzType="plus"></span>新增</button>
    <button nz-button (click)="expandAll = !expandAll">展开/折叠</button>
  </div>

  <app-builder-table
    [columns]="columns"
    [data]="menuList()"
    [loading]="loading()"
    [tree]="true"
    [expandAll]="expandAll"
    [showPagination]="false"
    [showCheckbox]="false"
    rowKey="menuId"
    scrollX="1100px"
    actionWidth="200px"
  >
    <ng-template #actions let-row>
      <a *hasPermi="['system:menu:edit']" (click)="openEdit(row)">修改</a>
      <span class="sep">|</span>
      <a *hasPermi="['system:menu:add']" (click)="openAdd(row)">新增</a>
      <span class="sep">|</span>
      <a *hasPermi="['system:menu:remove']" (click)="remove(row)">删除</a>
    </ng-template>
  </app-builder-table>
</div>
<nz-modal [(nzVisible)]="modalVisible" [nzTitle]="modalTitle" [nzWidth]="680" [nzFooter]="modalFooter" (nzOnCancel)="modalVisible=false">
  <ng-container *nzModalContent>
    @if (modalVisible) {
      <app-builder-form #bf layout="vertical" [showSubmit]="false" [formConfig]="formConfig"></app-builder-form>
    }
  </ng-container>
</nz-modal>
<ng-template #modalFooter>
  <button nz-button (click)="modalVisible=false">取 消</button>
  <button nz-button nzType="primary" [nzLoading]="submitting" (click)="submit()">确 定</button>
</ng-template>
