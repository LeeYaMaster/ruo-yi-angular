<div class="page">
  <form nz-form nzLayout="inline" class="query-form">
    <nz-form-item><nz-form-label>登录地址</nz-form-label><nz-form-control><input nz-input [(ngModel)]="query.ipaddr" name="ipaddr" (keyup.enter)="onQuery()" /></nz-form-control></nz-form-item>
    <nz-form-item><nz-form-label>用户名称</nz-form-label><nz-form-control><input nz-input [(ngModel)]="query.userName" name="userName" (keyup.enter)="onQuery()" /></nz-form-control></nz-form-item>
    <nz-form-item><nz-form-label>状态</nz-form-label><nz-form-control>
      <nz-select [(ngModel)]="query.status" name="status" nzAllowClear style="width:140px">
        @for (d of statusOptions; track d.value) { <nz-option [nzValue]="d.value" [nzLabel]="d.label"></nz-option> }
      </nz-select>
    </nz-form-control></nz-form-item>
    <nz-form-item>
      <button nz-button nzType="primary" (click)="onQuery()"><span nz-icon nzType="search"></span>搜索</button>
      <button nz-button class="ml8" (click)="onReset()"><span nz-icon nzType="reload"></span>重置</button>
    </nz-form-item>
  </form>
  <div class="toolbar">
    <button *hasPermi="['monitor:logininfor:remove']" nz-button nzDanger [disabled]="!checkedIds.size" (click)="remove()"><span nz-icon nzType="delete"></span>删除</button>
    <button *hasPermi="['monitor:logininfor:remove']" nz-button nzDanger (click)="clean()"><span nz-icon nzType="delete"></span>清空</button>
    <button *hasPermi="['monitor:logininfor:unlock']" nz-button [disabled]="checkedIds.size!==1" (click)="unlockSelected()"><span nz-icon nzType="unlock"></span>解锁</button>
    <button *hasPermi="['monitor:logininfor:export']" nz-button (click)="export()"><span nz-icon nzType="download"></span>导出</button>
  </div>
  <app-builder-table
    #bt
    [columns]="columns"
    [data]="list()"
    [loading]="loading()"
    [total]="total()"
    [pageIndex]="query.pageNum"
    [pageSize]="query.pageSize"
    rowKey="infoId"
    (pageIndexChange)="onPageIndexChange($event)"
    (pageSizeChange)="onPageSizeChange($event)"
    (selectionChange)="onSelection($event)"
  >
    <ng-template #actions let-row>
      <a *hasPermi="['monitor:logininfor:unlock']" (click)="unlock(row)">解锁</a>
    </ng-template>
  </app-builder-table>
</div>
