<div class="page-wrap">
  <div class="dept-pane">
    <input nz-input placeholder="请输入部门名称" [(ngModel)]="deptFilter" style="margin-bottom: 12px" />
    <nz-tree
      [nzData]="deptNodes()"
      nzShowLine
      (nzClick)="onDeptClick($event)"
    ></nz-tree>
  </div>

  <div class="main-pane">
    <form nz-form nzLayout="inline" class="query-form">
      <nz-form-item>
        <nz-form-label>用户账号</nz-form-label>
        <nz-form-control>
          <input nz-input [(ngModel)]="query.userName" name="userName" placeholder="请输入用户账号" (keyup.enter)="onQuery()" />
        </nz-form-control>
      </nz-form-item>
      <nz-form-item>
        <nz-form-label>手机号码</nz-form-label>
        <nz-form-control>
          <input nz-input [(ngModel)]="query.phonenumber" name="phonenumber" placeholder="请输入手机号码" (keyup.enter)="onQuery()" />
        </nz-form-control>
      </nz-form-item>
      <nz-form-item>
        <nz-form-label>状态</nz-form-label>
        <nz-form-control>
          <nz-select [(ngModel)]="query.status" name="status" nzAllowClear nzPlaceHolder="用户状态" style="width: 160px">
            @for (d of statusOptions; track d.value) {
              <nz-option [nzValue]="d.value" [nzLabel]="d.label"></nz-option>
            }
          </nz-select>
        </nz-form-control>
      </nz-form-item>
      <nz-form-item>
        <button nz-button nzType="primary" (click)="onQuery()"><span nz-icon nzType="search"></span>搜索</button>
        <button nz-button class="ml8" (click)="onReset()"><span nz-icon nzType="reload"></span>重置</button>
      </nz-form-item>
    </form>

    <div class="toolbar">
      <button *hasPermi="['system:user:add']" nz-button nzType="primary" (click)="openAdd()"><span nz-icon nzType="plus"></span>新增</button>
      <button *hasPermi="['system:user:edit']" nz-button nzType="default" [disabled]="checkedIds.size !== 1" (click)="openEdit()"><span nz-icon nzType="edit"></span>修改</button>
      <button *hasPermi="['system:user:remove']" nz-button nzDanger [disabled]="!checkedIds.size" (click)="remove()"><span nz-icon nzType="delete"></span>删除</button>
      <button *hasPermi="['system:user:import']" nz-button (click)="openImport()"><span nz-icon nzType="upload"></span>导入</button>
      <button *hasPermi="['system:user:export']" nz-button (click)="export()"><span nz-icon nzType="download"></span>导出</button>
    </div>

    <app-builder-table
      #bt
      [columns]="columns"
      [data]="userList()"
      [loading]="loading()"
      [total]="total()"
      [pageIndex]="query.pageNum"
      [pageSize]="query.pageSize"
      rowKey="userId"
      actionWidth="240px"
      (pageIndexChange)="onPageIndexChange($event)"
      (pageSizeChange)="onPageSizeChange($event)"
      (selectionChange)="onSelection($event)"
    >
      <ng-template #actions let-row>
        @if (row.userId !== 1) {
          <a *hasPermi="['system:user:edit']" (click)="openEdit(row)">修改</a>
          <span class="sep">|</span>
          <a *hasPermi="['system:user:remove']" (click)="remove(row)">删除</a>
          <span class="sep">|</span>
          <a *hasPermi="['system:user:resetPwd']" (click)="resetPwd(row)">重置</a>
          <span class="sep">|</span>
          <a *hasPermi="['system:user:edit']" (click)="goAuthRole(row)">分配角色</a>
        }
      </ng-template>
    </app-builder-table>

  </div>
</div>

<nz-modal
  [(nzVisible)]="modalVisible"
  [nzTitle]="modalTitle"
  [nzWidth]="680"
  [nzFooter]="userFooter"
  (nzOnCancel)="modalVisible = false"
>
  <ng-container *nzModalContent>
    @if (modalVisible) {
      <app-builder-form #bf layout="vertical" [showSubmit]="false" [formConfig]="formConfig"></app-builder-form>
    }
  </ng-container>
</nz-modal>
<ng-template #userFooter>
  <button nz-button (click)="modalVisible=false">取 消</button>
  <button nz-button nzType="primary" [nzLoading]="submitting" (click)="submit()">确 定</button>
</ng-template>

<nz-modal [(nzVisible)]="importVisible" nzTitle="用户导入" [nzOkLoading]="importSubmitting" (nzOnCancel)="importVisible=false" (nzOnOk)="submitImport()">
  <ng-container *nzModalContent>
    <nz-upload nzType="drag" [nzBeforeUpload]="beforeImportUpload" [nzFileList]="importFileList" nzAccept=".xls,.xlsx" [nzLimit]="1">
      <p class="ant-upload-drag-icon"><span nz-icon nzType="inbox"></span></p>
      <p class="ant-upload-text">将文件拖到此处，或点击上传</p>
      <p class="ant-upload-hint">仅允许导入 xls、xlsx 格式文件。</p>
    </nz-upload>
    <label style="display:block;margin-top:12px">
      <label nz-checkbox [(ngModel)]="updateSupport" name="updateSupport">是否更新已经存在的用户数据</label>
    </label>
    <a (click)="downloadTemplate()" style="display:inline-block;margin-top:8px">下载模板</a>
  </ng-container>
</nz-modal>
