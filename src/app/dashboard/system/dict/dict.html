<div class="page">
  <form nz-form nzLayout="inline" class="query-form">
    <nz-form-item><nz-form-label>字典名称</nz-form-label><nz-form-control><input nz-input [(ngModel)]="query.dictName" name="dictName" (keyup.enter)="onQuery()" /></nz-form-control></nz-form-item>
    <nz-form-item><nz-form-label>字典类型</nz-form-label><nz-form-control><input nz-input [(ngModel)]="query.dictType" name="dictType" (keyup.enter)="onQuery()" /></nz-form-control></nz-form-item>
    <nz-form-item><nz-form-label>状态</nz-form-label><nz-form-control>
      <nz-select [(ngModel)]="query.status" name="status" nzAllowClear style="width:140px">
        @for (d of statusOptions; track d.value) { <nz-option [nzValue]="d.value" [nzLabel]="d.label"></nz-option> }
      </nz-select>
    </nz-form-control></nz-form-item>
    <nz-form-item>
      <button nz-button nzType="primary" (click)="onQuery()"><span nz-icon nzType="search"></span>搜索</button>
      <button nz-button class="ml8" (click)="onReset()"><span nz-icon nzType="reload"></span>重置</button>
    </nz-form-item>
  </form>
  <div class="toolbar">
    <button *hasPermi="['system:dict:add']" nz-button nzType="primary" (click)="openAdd()"><span nz-icon nzType="plus"></span>新增</button>
    <button *hasPermi="['system:dict:edit']" nz-button [disabled]="checkedIds.size!==1" (click)="openEdit()"><span nz-icon nzType="edit"></span>修改</button>
    <button *hasPermi="['system:dict:remove']" nz-button nzDanger [disabled]="!checkedIds.size" (click)="remove()"><span nz-icon nzType="delete"></span>删除</button>
    <button *hasPermi="['system:dict:remove']" nz-button (click)="refreshCache()"><span nz-icon nzType="reload"></span>刷新缓存</button>
    <button *hasPermi="['system:dict:export']" nz-button (click)="export()"><span nz-icon nzType="download"></span>导出</button>
  </div>
  <app-builder-table
    #bt
    [columns]="columns"
    [data]="list()"
    [loading]="loading()"
    [total]="total()"
    [pageIndex]="query.pageNum"
    [pageSize]="query.pageSize"
    rowKey="dictId"
    actionWidth="180px"
    (pageIndexChange)="onPageIndexChange($event)"
    (pageSizeChange)="onPageSizeChange($event)"
    (selectionChange)="onSelection($event)"
  >
    <ng-template #actions let-row>
      <a (click)="openData(row)">数据</a><span class="sep">|</span>
      <a *hasPermi="['system:dict:edit']" (click)="openEdit(row)">修改</a><span class="sep">|</span>
      <a *hasPermi="['system:dict:remove']" (click)="remove(row)">删除</a>
    </ng-template>
  </app-builder-table>
</div>

<nz-modal [(nzVisible)]="modalVisible" [nzTitle]="modalTitle" [nzFooter]="modalFooter" (nzOnCancel)="modalVisible=false">
  <ng-container *nzModalContent>
    @if (modalVisible) {
      <app-builder-form #bf layout="vertical" [showSubmit]="false" [formConfig]="formConfig"></app-builder-form>
    }
  </ng-container>
</nz-modal>
<ng-template #modalFooter>
  <button nz-button (click)="modalVisible=false">取 消</button>
  <button nz-button nzType="primary" [nzLoading]="submitting" (click)="submit()">确 定</button>
</ng-template>

<nz-drawer [nzVisible]="dataOpen" nzWidth="720" nzTitle="字典数据" (nzOnClose)="dataOpen=false">
  <ng-container *nzDrawerContent>
    <div class="toolbar">
      <button *hasPermi="['system:dict:add']" nz-button nzType="primary" (click)="openAddData()"><span nz-icon nzType="plus"></span>新增</button>
      <span class="ml8">类型：{{ currentType }}</span>
    </div>
    <app-builder-table
      #dbt
      [columns]="dataColumns"
      [data]="dataList"
      [loading]="dataLoading"
      [total]="dataTotal"
      [pageIndex]="dataQuery.pageNum"
      [pageSize]="dataQuery.pageSize"
      rowKey="dictCode"
      [showCheckbox]="false"
      (pageIndexChange)="dataQuery.pageNum=$event; getDataList()"
      (pageSizeChange)="dataQuery.pageSize=$event; dataQuery.pageNum=1; getDataList()"
    >
      <ng-template #actions let-row>
        <a *hasPermi="['system:dict:edit']" (click)="openEditData(row)">修改</a><span class="sep">|</span>
        <a *hasPermi="['system:dict:remove']" (click)="removeData(row)">删除</a>
      </ng-template>
    </app-builder-table>
  </ng-container>
</nz-drawer>

<nz-modal [(nzVisible)]="dataModalVisible" [nzTitle]="dataModalTitle" [nzFooter]="dataFooter" (nzOnCancel)="dataModalVisible=false">
  <ng-container *nzModalContent>
    @if (dataModalVisible) {
      <app-builder-form #dbf layout="vertical" [showSubmit]="false" [formConfig]="dataFormConfig"></app-builder-form>
    }
  </ng-container>
</nz-modal>
<ng-template #dataFooter>
  <button nz-button (click)="dataModalVisible=false">取 消</button>
  <button nz-button nzType="primary" [nzLoading]="dataSubmitting" (click)="submitData()">确 定</button>
</ng-template>
