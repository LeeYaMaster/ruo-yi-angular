<div class="page">
  <form nz-form nzLayout="inline" class="query-form">
    <nz-form-item><nz-form-label>任务名称</nz-form-label><nz-form-control><input nz-input [(ngModel)]="query.jobName" name="jobName" (keyup.enter)="onQuery()" /></nz-form-control></nz-form-item>
    <nz-form-item><nz-form-label>任务组名</nz-form-label><nz-form-control>
      <nz-select [(ngModel)]="query.jobGroup" name="jobGroup" nzAllowClear style="width:140px">
        @for (d of groupOptions; track d.value) { <nz-option [nzValue]="d.value" [nzLabel]="d.label"></nz-option> }
      </nz-select>
    </nz-form-control></nz-form-item>
    <nz-form-item><nz-form-label>状态</nz-form-label><nz-form-control>
      <nz-select [(ngModel)]="query.status" name="status" nzAllowClear style="width:140px">
        @for (d of statusOptions; track d.value) { <nz-option [nzValue]="d.value" [nzLabel]="d.label"></nz-option> }
      </nz-select>
    </nz-form-control></nz-form-item>
    <nz-form-item>
      <button nz-button nzType="primary" (click)="onQuery()"><span nz-icon nzType="search"></span>搜索</button>
      <button nz-button class="ml8" (click)="onReset()"><span nz-icon nzType="reload"></span>重置</button>
    </nz-form-item>
  </form>
  <div class="toolbar">
    <button *hasPermi="['monitor:job:add']" nz-button nzType="primary" (click)="openAdd()"><span nz-icon nzType="plus"></span>新增</button>
    <button *hasPermi="['monitor:job:edit']" nz-button [disabled]="checkedIds.size!==1" (click)="openEdit()"><span nz-icon nzType="edit"></span>修改</button>
    <button *hasPermi="['monitor:job:remove']" nz-button nzDanger [disabled]="!checkedIds.size" (click)="remove()"><span nz-icon nzType="delete"></span>删除</button>
    <button *hasPermi="['monitor:job:query']" nz-button (click)="goJobLog()"><span nz-icon nzType="file-text"></span>日志</button>
    <button *hasPermi="['monitor:job:export']" nz-button (click)="export()"><span nz-icon nzType="download"></span>导出</button>
  </div>
  <app-builder-table
    #bt
    [columns]="columns"
    [data]="list()"
    [loading]="loading()"
    [total]="total()"
    [pageIndex]="query.pageNum"
    [pageSize]="query.pageSize"
    rowKey="jobId"
    actionWidth="220px"
    (pageIndexChange)="onPageIndexChange($event)"
    (pageSizeChange)="onPageSizeChange($event)"
    (selectionChange)="onSelection($event)"
  >
    <ng-template #actions let-row>
      <a *hasPermi="['monitor:job:edit']" (click)="openEdit(row)">修改</a><span class="sep">|</span>
      <a *hasPermi="['monitor:job:remove']" (click)="remove(row)">删除</a><span class="sep">|</span>
      <a *hasPermi="['monitor:job:changeStatus']" (click)="run(row)">执行一次</a><span class="sep">|</span>
      <a *hasPermi="['monitor:job:query']" (click)="goJobLog(row)">日志</a>
    </ng-template>
  </app-builder-table>
</div>
<nz-modal [(nzVisible)]="modalVisible" [nzTitle]="modalTitle" [nzWidth]="680" [nzFooter]="modalFooter" (nzOnCancel)="modalVisible=false">
  <ng-container *nzModalContent>
    @if (modalVisible) {
      <app-builder-form #bf layout="vertical" [showSubmit]="false" [formConfig]="formConfig"></app-builder-form>
    }
  </ng-container>
</nz-modal>
<ng-template #modalFooter>
  <button nz-button (click)="modalVisible=false">取 消</button>
  <button nz-button nzType="primary" [nzLoading]="submitting" (click)="submit()">确 定</button>
</ng-template>
