<nz-table
  #tbl
  [nzData]="data"
  [nzLoading]="loading"
  [nzFrontPagination]="false"
  [nzTotal]="total"
  [nzPageIndex]="pageIndex"
  [nzPageSize]="pageSize"
  [nzShowSizeChanger]="true"
  [nzBordered]="bordered"
  [nzSize]="size"
  (nzPageIndexChange)="pageIndexChange.emit($event)"
  (nzPageSizeChange)="pageSizeChange.emit($event)"
  (nzCurrentPageDataChange)="onCurrentPageDataChange($event)"
>
  <thead>
    <tr>
      @if (showCheckbox) {
        <th
          [nzChecked]="checked"
          [nzIndeterminate]="indeterminate"
          (nzCheckedChange)="onAllChecked($event)"
        ></th>
      }
      @for (col of columns; track col.key) {
        <th [nzWidth]="col.width || null" [nzAlign]="col.align || null">{{ col.title }}</th>
      }
      @if (actionsTpl) {
        <th [nzWidth]="actionWidth">操作</th>
      }
    </tr>
  </thead>
  <tbody>
    @for (row of tbl.data; track trackRow($index, row)) {
      <tr>
        @if (showCheckbox) {
          <td
            [nzChecked]="setOfCheckedId.has(row[rowKey])"
            (nzCheckedChange)="onItemChecked(row[rowKey], $event)"
          ></td>
        }
        @for (col of columns; track col.key) {
          <td [nzAlign]="col.align || null">{{ cellValue(row, col) }}</td>
        }
        @if (actionsTpl) {
          <td>
            <ng-container *ngTemplateOutlet="actionsTpl; context: { $implicit: row }"></ng-container>
          </td>
        }
      </tr>
    }
  </tbody>
</nz-table>
